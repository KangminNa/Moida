packages:
  - apps/*
  - packages/*

# 설치 스크립트 실행을 허용할 패키지 (pnpm 10은 기본적으로 막음)
onlyBuiltDependencies:
  - "@nestjs/core"
  - "@swc/core"
  - sharp

# 보안 패치가 나왔는데 쓰는 패키지가 아직 옛 버전을 묶어 둔 간접 의존 패키지 (pnpm audit, 2026-10-25).
# 위의 패키지(@nestjs/platform-express · @modelcontextprotocol/sdk)가 새 버전을 따라오면 지운다.
# zod는 MCP SDK의 짝(peer) 패키지라 여기가 아니라 apps/server에 직접 고정한다 (4.6.6 이상)
overrides:
  body-parser: ^2.4.0
  fast-uri: ^3.1.9
  ip-address: ^10.7.4
  multer: ^2.5.0

# pnpm audit(CI의 --audit-level high)에서 빼는 보안 권고. 항목마다 까닭과 지우는 때를 적는다 (사용자 결정 2026-11-18)
auditConfig:
  ignoreGhsas:
    # picomatch ReDoS (GHSA-fc5q-39xc-vjpf, 4.0.7 이하 전부): 패치 버전이 아직 없어 업그레이드로 막을 수 없다.
    # 개발 도구 knip만 쓰고 운영 이미지에는 없다(서버는 pnpm deploy --prod). knip에 넣는 패턴은 저장소의 설정 파일뿐이다.
    # picomatch 패치 버전이 나오면 overrides로 올리고 이 줄을 지운다
    - GHSA-fc5q-39xc-vjpf
