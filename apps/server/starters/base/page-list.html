{{#pages.length}}
<ol class="post-list">
  {{#pages}}
  <li>
    <a href="{{url}}">
      <h2>{{title}}</h2>
      <div class="post-meta"><time datetime="{{date}}">{{dateText}}</time></div>
    </a>
  </li>
  {{/pages}}
</ol>
{{/pages.length}}
{{^pages.length}}<p class="blog-empty">공개한 페이지 없음</p>{{/pages.length}}
