<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="icon" href="{{#app.iconUrl}}{{app.iconUrl}}{{/app.iconUrl}}{{^app.iconUrl}}{{files}}/icon.svg{{/app.iconUrl}}">
<link rel="stylesheet" href="{{files}}/style.css">
</head>
<body>
{{! 페이지 앱의 시작 코드: 블로그 틀(머리 · 메뉴 · 꼬리) 없는 빈 화면이다. 이 앱이 하는 일에 맞게 처음부터 만든다.
    다른 화면은 이름.html 파일을 더하면 앱 주소 뒤의 /이름 이 된다 }}
<main class="screen">
  <h1>{{app.name}}</h1>
  {{#app.description}}<p class="lead">{{app.description}}</p>{{/app.description}}
</main>
{{#others.length}}<a class="all-apps" href="{{site.home}}">모든 앱</a>{{/others.length}}
</body>
</html>
