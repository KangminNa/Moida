<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>앱</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 새 앱의 시작 코드 (2026-11-25 A4): 틀 없는 빈 정적 앱이다. 화면은 스킬 moida-make의 디자인 조사(design.md)대로 처음부터 만든다.
     데이터는 웹이 <head>에 싣는 moida-data 블록(그 주소의 것)에서 읽는다 -->
<main class="screen">
  <h1 id="name"></h1>
  <p class="lead" id="description" hidden></p>
  <p class="muted">화면을 준비하고 있어요</p>
</main>
<a class="all-apps" id="all-apps" hidden>모든 앱</a>
<script>
  (function () {
    var block = document.getElementById('moida-data');
    var data = block ? JSON.parse(block.textContent) : {};
    var app = data.app || {};
    document.title = app.name || '앱';
    document.getElementById('name').textContent = app.name || '';
    var description = document.getElementById('description');
    if (app.description) {
      description.textContent = app.description;
      description.hidden = false;
    }
    if (app.iconUrl) document.querySelector('link[rel=icon]').href = app.iconUrl;
    var all = document.getElementById('all-apps');
    if (data.others && data.others.length && data.site && data.site.store) {
      all.href = data.site.store;
      all.hidden = false;
    }
  })();
</script>
</body>
</html>
